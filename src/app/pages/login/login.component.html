<div class="login-page">
  <div class="login-card">
    <div class="login-mono">M&J</div>
    <h1 class="login-title">Admin</h1>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="fg">
        <label class="fl" for="email">Email</label>
        <div class="fi-wrap">
          <input
            id="email"
            class="fi"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@moniyjose.com"
            autocomplete="email"
            [class.fi--error]="!!email && !!emailError"
          />
          <span class="fi-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
        </div>
        <span class="ferr" *ngIf="!!email && !!emailError">{{ emailError }}</span>
      </div>

      <div class="fg">
        <label class="fl" for="password">Contraseña</label>
        <div class="fi-wrap">
          <input
            id="password"
            class="fi"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.fi--error]="!!password && !!passwordError"
          />
          <button type="button" class="fi-toggle" (click)="showPassword = !showPassword" tabindex="-1" aria-label="Mostrar contraseña">
            <svg *ngIf="!showPassword" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <span class="ferr" *ngIf="!!password && !!passwordError">{{ passwordError }}</span>
      </div>

      <div class="login-error" *ngIf="error">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>

      <button class="btn-f login-btn" type="submit" [disabled]="loading || !valid">
        <span [class.loading]="loading">{{ loading ? 'Ingresando…' : 'Ingresar' }}</span>
      </button>
    </form>

    <a class="login-back" [routerLink]="['/invi', 'default']">← Volver al inicio</a>
  </div>
</div>
