      </div>
      <h1 class="es-title">Seleccionar Evento</h1>
      <p class="es-sub">Elige el evento que deseas administrar</p>
    </div>

    <div class="es-body">
      <div *ngIf="loading" class="es-loading">
        <div class="es-spinner"></div>
      </div>

      <div *ngIf="!loading && events.length === 0" class="es-empty">
        <p>No tienes eventos aún.</p>
      </div>

      <div *ngFor="let event of events" class="es-card" (click)="selectEvent(event)">
        <div class="es-card-bg" [style.background]="event.primary_color || 'var(--forest)'"></div>
        <div class="es-card-content">
          <div class="es-card-title">{{ event.title }}</div>
          <div class="es-card-meta">
            <span>{{ event.event_date | date: 'longDate' }}</span>
            <span *ngIf="event.location"> · {{ event.location }}</span>
          </div>
          <div class="es-card-status" [class.active]="event.status === 'active'">{{ event.status }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
