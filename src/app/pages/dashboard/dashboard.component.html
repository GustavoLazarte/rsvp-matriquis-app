<div class="dash-page">
  <header class="dash-header">
    <div class="dash-header-inner">
      <div class="dash-brand">M&J · Dashboard</div>
      <div class="dash-user">
        <span class="dash-user-mail">{{ user?.email || 'admin' }}</span>
        <button class="dash-logout" (click)="onLogout()">Cerrar sesión</button>
      </div>
    </div>
  </header>
  <main class="dash-main">
    <h2 class="dash-welcome">Panel de Administración</h2>
    <p class="dash-sub">Gestión de invitados y configuración de la boda</p>

    <div class="dash-cards">
      <div class="dash-card">
        <div class="dash-card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="dash-card-label">Invitados</div>
        <div class="dash-card-val">—</div>
        <div class="dash-card-desc">Los RSVP se registran en Google Sheets</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="dash-card-label">Fecha</div>
        <div class="dash-card-val">13 Sep 2026</div>
        <div class="dash-card-desc">Cochabamba, Bolivia</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <div class="dash-card-label">Sitio web</div>
        <div class="dash-card-val">En vivo</div>
        <div class="dash-card-desc">moniyjose.rsvp</div>
      </div>
    </div>

    <div class="dash-section">
      <h3 class="dash-section-title">Enlaces rápidos</h3>
      <div class="dash-links">
        <a class="dash-link" href="https://docs.google.com/spreadsheets" target="_blank" rel="noreferrer">Ver Google Sheets →</a>
        <a class="dash-link" [routerLink]="['/invi', 'default']">Ver sitio público →</a>
      </div>
    </div>
  </main>
</div>
