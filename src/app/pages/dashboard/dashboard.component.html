<div class="dash-shell">
  <div class="dash-overlay" [class.open]="sidebarOpen" (click)="sidebarOpen = false"></div>

  <app-sidebar
    [user]="user"
    [activeTab]="activeTab"
    [pendingCount]="stats.pending"
    [sidebarOpen]="sidebarOpen"
    [coupleLogoUrl]="eventSettings().couple_logo_url"
    (setTab)="setTab($event)"
    (logout)="onLogout()"
    (closeSidebar)="sidebarOpen = false">
  </app-sidebar>

  <div class="dash-main-area">
    <app-topbar
      [activeTab]="activeTab"
      [userEmail]="user?.email || 'admin'"
      (toggleSidebar)="sidebarOpen = !sidebarOpen">
    </app-topbar>

    <main class="dash-content">
      <app-overview
        *ngIf="activeTab === 'overview'"
        [userEmailDisplay]="userEmailDisplay"
        [eventSettings]="eventSettings()"
        [stats]="stats"
        [recentRsvps]="recentRsvps()"
        (setTab)="setTab($event)">
      </app-overview>

      <app-guests
        *ngIf="activeTab === 'guests'"
        [invitations]="invitations()"
        [responses]="responses()"
        [eventId]="eventSettings().id"
        [searchQuery]="searchQuery"
        [statusFilter]="statusFilter"
        [eventSettings]="eventSettings()"
        (searchQueryChange)="searchQuery = $event"
        (statusFilterChange)="statusFilter = $event">
      </app-guests>

      <ng-container *ngIf="activeTab === 'gallery'">
        <div class="dash-gallery-tabs">
          <button class="dash-gallery-tab" [class.active]="gallerySubTab === 'album'" (click)="setGallerySubTab('album')">Álbum</button>
          <button class="dash-gallery-tab" [class.active]="gallerySubTab === 'photos'" (click)="setGallerySubTab('photos')">Fotos generales</button>
        </div>

        <app-album-manager
          *ngIf="gallerySubTab === 'album'"
          [albumImages]="albumImages()"
          [uploading]="uploadingAlbum"
          [savingCaptionId]="savingCaptionId"
          (addFiles)="onAlbumFilesSelected($event)"
          (removeImage)="removeAlbumImage($event)"
          (updateCaption)="updateAlbumCaption($event)"
          (moveUp)="moveAlbumImage($event, 'up')"
          (moveDown)="moveAlbumImage($event, 'down')">
        </app-album-manager>

        <app-general-photos
          *ngIf="gallerySubTab === 'photos'"
          [photos]="eventImages()"
          (addFiles)="onGeneralFilesSelected($event)"
          (removePhoto)="removeGeneralPhoto($event)">
        </app-general-photos>
      </ng-container>

      <app-settings
        *ngIf="activeTab === 'settings'"
        (save)="saveSettings($event)">
      </app-settings>
    </main>
  </div>
</div>
