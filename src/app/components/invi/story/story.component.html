<section id="story">
  <div class="inner">
    <span class="eyebrow reveal">{{ i18n.t('story_label') }}</span>
    <h2 class="h2 reveal rd1" [innerHTML]="storyTitleHtml"></h2>
    <div class="rule reveal rd2"></div>
    <p class="story-body reveal rd2">{{ i18n.t('story_body') }}</p>
    <blockquote class="story-quote reveal rd3">{{ i18n.t('story_quote') }}</blockquote>
  </div>
</section>
