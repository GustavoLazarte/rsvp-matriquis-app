<div class="hero" id="hero">
  <div class="hero-bg"></div>
  <div class="hero-vline hvl1"></div>
  <div class="hero-vline hvl2"></div>
  <div class="hero-ring hr1"></div>
  <div class="hero-ring hr2"></div>

  <div class="lang-toggle">
    <button class="lang-btn" [class.active]="i18n.current === 'es'" (click)="setLang('es')">ES</button>
    <button class="lang-btn" [class.active]="i18n.current === 'en'" (click)="setLang('en')">EN</button>
  </div>

  <div class="hero-content">
    <img class="hero-logo" [src]="rsvpEvent?.couple_logo_url" alt="logo" />

    <div class="hero-eyebrow">{{ dateFormat }} — {{ rsvpEvent?.location }}</div>
    <div class="hero-names">
      <span class="hero-name-primary">{{ nameParts[0] }}</span>
      <span class="hero-amp">&amp;</span>
      <span class="hero-name-primary">{{ nameParts[1] }}</span>
    </div>
    <div class="hero-sub">{{ rsvpEvent?.adress }}</div>
    <button class="hero-cta" (click)="scrollToRsvp()">{{ i18n.t('nav_rsvp') }}</button>
  </div>
  <div class="hero-chevron" (click)="scrollToStory()">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 9l6 6 6-6"/></svg>
  </div>
</div>
