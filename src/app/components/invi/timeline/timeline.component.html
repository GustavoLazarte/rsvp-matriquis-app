<section id="timeline">
  <div class="inner">
    <span class="eyebrow reveal">{{ i18n.t('tl_label') }}</span>
    <h2 class="h2 reveal rd1">{{ i18n.t('tl_title') }}</h2>
    <div class="rule reveal rd2"></div>

    <div class="tl-desktop">
      <div class="tl-d-wrap">
        <div class="tl-d-axis"></div>

        <ng-container *ngFor="let ev of events; let i = index">
          <div class="tl-d-row" *ngIf="i % 2 === 0">
            <div class="tl-d-cell left reveal" [class.gold]="ev.gold" [style.transition-delay]="i * 0.1 + 's'">
              <div class="tl-d-time">{{ ev.time }}</div>
              <div class="tl-d-name">{{ ev.name }}</div>
              <div class="tl-d-desc">{{ ev.desc }}</div>
            </div>
            <div class="tl-d-center reveal" [style.transition-delay]="i * 0.1 + 's'">
              <div class="tl-d-node" [class.gold]="ev.gold">{{ ev.emoji }}</div>
            </div>
            <div></div>
          </div>
          <div class="tl-d-row" *ngIf="i % 2 !== 0">
            <div></div>
            <div class="tl-d-center reveal" [style.transition-delay]="i * 0.1 + 's'">
              <div class="tl-d-node" [class.gold]="ev.gold">{{ ev.emoji }}</div>
            </div>
            <div class="tl-d-cell reveal" [class.gold]="ev.gold" [style.transition-delay]="i * 0.1 + 's'">
              <div class="tl-d-time">{{ ev.time }}</div>
              <div class="tl-d-name">{{ ev.name }}</div>
              <div class="tl-d-desc">{{ ev.desc }}</div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>

    <div class="tl-mobile">
      <div class="tl-m-wrap">
        <div class="tl-m-axis"></div>
        <div class="tl-m-item reveal" *ngFor="let ev of events; let i = index" [class.gold]="ev.gold" [style.transition-delay]="i * 0.08 + 's'">
          <div class="tl-m-node" [class.gold]="ev.gold">{{ ev.emoji }}</div>
          <div class="tl-m-time">{{ ev.time }}</div>
          <div class="tl-m-name">{{ ev.name }}</div>
          <div class="tl-m-desc">{{ ev.desc }}</div>
        </div>
      </div>
    </div>
  </div>
</section>
