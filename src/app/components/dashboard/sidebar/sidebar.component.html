<aside class="dash-sidebar" [class.open]="sidebarOpen">
  <div class="dash-sidebar-brand">
    <div class="dash-sidebar-logo">M&J</div>
    <span>Dashboard</span>
  </div>

  <nav class="dash-sidebar-nav">
    <button class="dash-sidebar-item" [class.active]="activeTab === 'overview'" (click)="setTab.emit('overview'); closeSidebar.emit()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <span>Overview</span>
    </button>
    <button class="dash-sidebar-item" [class.active]="activeTab === 'guests'" (click)="setTab.emit('guests'); closeSidebar.emit()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Invitados</span>
      <span class="dash-sidebar-badge">{{ pendingCount }}</span>
    </button>
    <button class="dash-sidebar-item" [class.active]="activeTab === 'gallery'" (click)="setTab.emit('gallery'); closeSidebar.emit()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span>Galería</span>
    </button>
    <button class="dash-sidebar-item" [class.active]="activeTab === 'settings'" (click)="setTab.emit('settings'); closeSidebar.emit()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Configuración</span>
    </button>
  </nav>

  <div class="dash-sidebar-footer">
    <div class="dash-sidebar-user">{{ user?.email || 'admin' }}</div>
    <button class="dash-sidebar-logout" (click)="logout.emit()">Cerrar sesión</button>
  </div>
</aside>
