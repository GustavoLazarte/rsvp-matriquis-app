<div class="dash-page-head">
  <h1 class="dash-h1">Fotos generales</h1>
  <p class="dash-p">Todas las fotos subidas por invitados y por el administrador del evento.</p>
</div>

<div class="dash-gallery-upload" (click)="fileInput.click()">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="opacity:0.6"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
  <span>Subir fotos generales</span>
  <input #fileInput type="file" accept="image/*" multiple style="display:none" (change)="addFiles.emit($event)" />
</div>

<div class="dash-photos" *ngIf="photos.length > 0; else emptyPhotos">
  <div class="dash-photo-card" *ngFor="let img of photos">
    <img [src]="img.url" alt="" />
    <button class="dash-photo-remove" (click)="removePhoto.emit(img.id)" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="dash-photo-overlay"></div>
  </div>
</div>

<ng-template #emptyPhotos>
  <p class="dash-empty">No hay fotos generales aún.</p>
</ng-template>
