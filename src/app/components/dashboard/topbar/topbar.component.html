<header class="dash-topbar">
  <button class="dash-hamburger" (click)="toggleSidebar.emit()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="dash-topbar-title">
    <span class="dash-topbar-label">{{ activeTab === 'overview' ? 'Panel general' : activeTab === 'guests' ? 'Invitados' : activeTab === 'gallery' ? 'Galería' : 'Configuración' }}</span>
  </div>
  <div class="dash-topbar-right">
    <span class="dash-topbar-email">{{ userEmail }}</span>
  </div>
</header>
