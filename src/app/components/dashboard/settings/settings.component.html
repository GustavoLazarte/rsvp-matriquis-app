<div class="dash-page-head">
  <h1 class="dash-h1">Configuración</h1>
  <p class="dash-p">Personaliza los datos del evento, la apariencia y los mensajes de la invitación</p>
</div>

<div class="dash-settings">
  <div class="dash-settings-section">
    <h2 class="dash-settings-section-title">Información del evento</h2>
    <div class="dash-settings-grid">
      <div class="dash-field">
        <label>Fecha del evento</label>
        <input class="dash-inp" [(ngModel)]="formData.date" />
      </div>
      <div class="dash-field">
        <label>Hora</label>
        <input class="dash-inp" [(ngModel)]="formData.time" />
      </div>
      <div class="dash-field">
        <label>Lugar</label>
        <input class="dash-inp" [(ngModel)]="formData.venue" />
      </div>
      <div class="dash-field">
        <label>Dirección</label>
        <input class="dash-inp" [(ngModel)]="formData.address" />
      </div>
      <div class="dash-field">
        <label>Fecha límite RSVP</label>
        <input class="dash-inp" type="date" [(ngModel)]="formData.deadline" />
      </div>
      <div class="dash-field">
        <label class="dash-checkbox">
          <input type="checkbox" [(ngModel)]="formData.adultsOnly" />
          <span>Solo adultos</span>
        </label>
      </div>
    </div>
  </div>

  <div class="dash-settings-section">
    <h2 class="dash-settings-section-title">Mensaje de bienvenida</h2>
    <div class="dash-field">
      <textarea class="dash-inp dash-textarea" rows="3" [(ngModel)]="formData.welcomeMessage"></textarea>
    </div>
  </div>

  <div class="dash-settings-section">
    <h2 class="dash-settings-section-title">Enlaces</h2>
    <div class="dash-settings-grid">
      <div class="dash-field">
        <label>Playlist (Spotify)</label>
        <input class="dash-inp" [(ngModel)]="formData.musicLink" placeholder="https://open.spotify.com/playlist/..." />
      </div>
      <div class="dash-field">
        <label>Mesa de regalos</label>
        <input class="dash-inp" [(ngModel)]="formData.giftsLink" placeholder="Opcional" />
      </div>
      <div class="dash-field">
        <label>Instagram</label>
        <input class="dash-inp" [(ngModel)]="formData.instagram" placeholder="@usuario" />
      </div>
    </div>
  </div>

  <button class="dash-btn" (click)="saveSettings()">Guardar configuración</button>
</div>
